# --- Cross-cutting: the finding banner (§2, "a real finding sitting in reports/") --
headline_finding:
  active: true
  title: "Error-independence complementarity: refuted at scale"
  summary: >
    Joint sweeps show LBPH and SFace false-accepts are positively associated
    (Yule's Q > 0 on every leg where estimable): they fail on the same hard impostor
    pairs. The cascade still wins on FAR (98 ppm on LFW1, undercutting both engines)
    via the gate plus AND-composition, not via error independence. The paper now reports
    this in §4.5. The cross-dataset overlays add a nuance: the correlation decorrelates
    as inputs degrade (obs/exp 12.85x on clean LFW, 2.02x light, 1.28x medium), so
    robustness and complementarity testing measure different things.
  source_doc: "docs/audits/STATE-07-10.md"
