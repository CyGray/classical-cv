 <title>Deployed gate routing on held-out LSDB-DL41 probes</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Deployed gate routing on held-out LSDB-DL41 probes</dc:title>
    <dc:date>2026-08-10T02:11:27+08:00</dc:date>
    <dc:description>Among 2,060 scored modified probes, the deployed gate escalated all 1,353 thresholded LBPH failures to SFace (100.0% recall). It escalated 40.88% of 707 thresholded LBPH-correct probes and retained 59.12% on the LBPH path. Escalation precision was 82.40%; 236 modified probes without the required gate signals were excluded from this routing analysis. Teal denotes escalated probes and slate gray denotes probes retained on the LBPH path.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:identifier>sha256:13de27c4b29e59a3bf8c3049441d70cc01fe8ce8aefba2a89dc1c08ab39110fb</dc:identifier>
    <dc:source>complementarity_test/reruns/lsdb_dl41_2026-08-10/accuracy_ratio_hybrid.json</dc:source>
    <dc:creator>
     <cc:Agent>
      <dc:title>LS-Face manuscript SVG exporter</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
